# Mirrors the "verify" job in .github/workflows/ci.yml on the Linux arm64 Crow agent.
steps:
  verify:
    image: python:3.12-bookworm
    commands:
      - apt-get update -qq
      - apt-get install --yes -qq zsh
      - python -m pip install -q -e '.[dev]'
      - pytest -q
when:
  event: [push, pull_request, manual]
