name: Backdoor CI

# Backdoor had no CI. Shawn's QA Assist reviewed its pull requests and then
# refused to merge them, saying "this repo has no gate I can trust" — correctly,
# because a review with nothing to run behind it is an opinion. This is that
# gate: the same suite that guards the router's failover, memory recall and
# context-budget behaviour, run on every pull request.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
