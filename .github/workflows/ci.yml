name: Backdoor CI

# Backdoor had no CI. Shawn's QA Assist reviewed its pull requests and then
# refused to merge them, saying "this repo has no gate I can trust" — correctly,
# because a review with nothing to run behind it is an opinion. This is that
# gate: the same suite that guards the router's failover, memory recall and
# context-budget behaviour, run on every pull request.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Crow CI on Shawn's Mac runs the same checks (.woodpecker.yaml) and posts a
  # ci/crow/... status within seconds of a push. This job waits up to 3 minutes for
  # one: found, the jobs below are skipped and Crow's result is the merge check;
  # none (Mac asleep or offline, webhook lost), they run here as before. A manual
  # run (workflow_dispatch) always runs them.
  crow-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: running GitHub CI."; echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          for _ in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq '[.[] | select(.context | startswith("ci/crow/"))] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "Crow picked up $SHA; skipping GitHub CI (Crow's status is the check)."
              echo run=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 15
          done
          echo "No Crow status on $SHA after 3 minutes (Mac asleep or offline); running GitHub CI."
          echo run=true >> "$GITHUB_OUTPUT"

  verify:
    needs: crow-gate
    if: needs.crow-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
